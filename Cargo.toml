[workspace]
resolver = "3"
members = ["crates/core", "crates/javascript"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
