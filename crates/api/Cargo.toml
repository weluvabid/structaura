[package]
name = "structaura"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
bench-internals = [
    "structaura-core/bench-internals",
    "structaura-javascript/bench-internals",
    "structaura-typescript/bench-internals",
]

[[example]]
name = "benchmark"
