edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
structaura-core = { path = "../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
